server:
  port: ${PORT:8082}

spring:
  application:
    name: expense-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:expense_db}
    username: ${DB_USERNAME:tracker}
    password: ${DB_PASSWORD:tracker}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true

jwt:
  secret: ${JWT_SECRET:this-is-a-dev-only-secret-key-change-it-before-prod-32bytes}

management:
  endpoints:
    web:
      exposure:
        include: health
